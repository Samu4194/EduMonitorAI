name: edumonitorai
x-api: &api
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 30s
x-environment: &environment
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__Key: ${JWT_KEY:?Ejecuta scripts/Start.ps1}
  Database__Initialize: "true"
  Services__Usuarios: http://usuarios:8080
  Services__Materias: http://materias:8080
  Services__Estudiantes: http://estudiantes:8080
  Services__Evaluaciones: http://evaluaciones:8080
  Services__Seguimiento: http://seguimiento:8080
services:
  usuarios:
    <<: *api
    build: {context: ., dockerfile: services/usuarios/Dockerfile}
    environment:
      <<: *environment
      ConnectionStrings__Default: "Server=host.docker.internal,1433;Database=EduMonitor_Usuarios;User Id=edumonitor_usuarios;Password=${USUARIOS_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
  materias:
    <<: *api
    build: {context: ., dockerfile: services/materias/Dockerfile}
    environment:
      <<: *environment
      ConnectionStrings__Default: "Server=host.docker.internal,1433;Database=EduMonitor_Materias;User Id=edumonitor_materias;Password=${MATERIAS_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
  estudiantes:
    <<: *api
    build: {context: ., dockerfile: services/estudiantes/Dockerfile}
    environment:
      <<: *environment
      ConnectionStrings__Default: "Server=host.docker.internal,1433;Database=EduMonitor_Estudiantes;User Id=edumonitor_estudiantes;Password=${ESTUDIANTES_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
  evaluaciones:
    <<: *api
    env_file:
      - path: ./.local/moodle.env
        required: false
    build: {context: ., dockerfile: services/evaluaciones/Dockerfile}
    environment:
      <<: *environment
      ConnectionStrings__Default: "Server=host.docker.internal,1433;Database=EduMonitor_Evaluaciones;User Id=edumonitor_evaluaciones;Password=${EVALUACIONES_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
      Archivos__Ruta: /data/archivos
    volumes:
      - edumonitor_archivos:/data/archivos
  seguimiento:
    <<: *api
    # Agente académico: la clave de Gemini (opcional) se guarda en .local/agente.env y no se sube a Git.
    env_file:
      - path: ./.local/agente.env
        required: false
    extra_hosts: ["host.docker.internal:host-gateway"]
    build: {context: ., dockerfile: services/seguimiento/Dockerfile}
    environment:
      <<: *environment
      ConnectionStrings__Default: "Server=host.docker.internal,1433;Database=EduMonitor_Seguimiento;User Id=edumonitor_seguimiento;Password=${SEGUIMIENTO_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
  # IA local opcional (docker compose --profile ia-local up -d ollama): modelo de lenguaje que corre en esta máquina, sin internet.
  ollama:
    profiles: ["ia-local"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes:
      - edumonitor_ollama:/root/.ollama
  gateway:
    restart: unless-stopped
    build: {context: ., dockerfile: gateway/Dockerfile}
    depends_on:
      usuarios: {condition: service_started}
      materias: {condition: service_started}
      estudiantes: {condition: service_started}
      evaluaciones: {condition: service_started}
      seguimiento: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 12
  frontend:
    restart: unless-stopped
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:5080:80"]
    depends_on:
      gateway: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  edumonitor_archivos:
  edumonitor_ollama:
