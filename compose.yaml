name: edumonitorai
x-api: &api
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 30s
  depends_on:
    database-init:
      condition: service_completed_successfully
x-environment: &environment
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__Key: ${JWT_KEY:?Ejecuta scripts/Start.ps1}
  Database__Initialize: "true"
  Services__Usuarios: http://usuarios:8080
  Services__Materias: http://materias:8080
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Ejecuta scripts/Start.ps1}
    ports: ["127.0.0.1:14333:1433"]
    volumes: ["edumonitor_sql:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-C", "-b", "-i", "/init/initialize.sql"]
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD}
      USUARIOS_PASSWORD: ${USUARIOS_PASSWORD}
      MATERIAS_PASSWORD: ${MATERIAS_PASSWORD}
      ESTUDIANTES_PASSWORD: ${ESTUDIANTES_PASSWORD}
    volumes: ["./database/initialize.sql:/init/initialize.sql:ro"]
    depends_on:
      sqlserver: {condition: service_healthy}
  usuarios:
    <<: *api
    build: {context: ., dockerfile: services/usuarios/Dockerfile}
    environment:
      <<: *environment
      ConnectionStrings__Default: "Server=sqlserver;Database=EduMonitor_Usuarios;User Id=edumonitor_usuarios;Password=${USUARIOS_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
  materias:
    <<: *api
    build: {context: ., dockerfile: services/materias/Dockerfile}
    environment:
      <<: *environment
      ConnectionStrings__Default: "Server=sqlserver;Database=EduMonitor_Materias;User Id=edumonitor_materias;Password=${MATERIAS_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
  estudiantes:
    <<: *api
    build: {context: ., dockerfile: services/estudiantes/Dockerfile}
    environment:
      <<: *environment
      ConnectionStrings__Default: "Server=sqlserver;Database=EduMonitor_Estudiantes;User Id=edumonitor_estudiantes;Password=${ESTUDIANTES_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=3"
  gateway:
    restart: unless-stopped
    build: {context: ., dockerfile: gateway/Dockerfile}
    depends_on:
      usuarios: {condition: service_started}
      materias: {condition: service_started}
      estudiantes: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 12
  frontend:
    restart: unless-stopped
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:5080:80"]
    depends_on:
      gateway: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  edumonitor_sql:
