server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location /api/ {
        set $gateway http://gateway:8080;
        proxy_pass $gateway$request_uri;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_intercept_errors on;
        error_page 502 504 =503 /unavailable;
    }
    location = /unavailable { internal; default_type application/json; return 503 '{"message":"El Gateway no está disponible. Inténtalo de nuevo en unos segundos."}'; }
    location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location / { try_files $uri $uri/ /index.html; }
}
